<style>
/* 版面：手機單欄（最寬 440），每頁一個畫面；珊瑚粉紙紋＋深藍字＋藍綠主按鈕，單一主題 */
:root {
  --page: #F28AA0;
  --cream: #FFF4E0;
  --navy: #1F2A44;
  --slate: #5A6278;
  --teal: #3FA7A3;
  --mustard: #F2C230;
  --orange: #F27B35;
  --blush: #FBE3E7;
  --backdrop: #2A1F33;
  --ink-scrim: rgba(31, 42, 68, .55);
  --shadow-photo: 0 6px 16px rgba(31, 42, 68, .18);
  --font: "Noto Sans TC", "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-back: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--backdrop);
  color: var(--navy);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
.app {
  position: relative;
  height: 100%;
  max-width: 440px;
  margin: 0 auto;
  overflow: hidden;
  background-color: var(--page);
  background-image: url("img/paper.webp");
  background-size: 384px;
  background-blend-mode: multiply;
  container-type: size;
}
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding-block: 18px 26px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.screen.scroll { overflow-y: auto; overscroll-behavior: contain; }
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; border-radius: 12px; }

/* ---------- 進場／離場（兩拍，俐落） ---------- */
[data-beat] { transform: translate(0, 0) rotate(var(--r, 0deg)); }
.screen.enter [data-beat="1"] { animation: beatIn .28s var(--ease-out) .06s both; }
.screen.enter [data-beat="2"] { animation: beatIn .22s var(--ease-back) .24s both; }
.screen.leave { animation: leave .22s var(--ease-out) both; pointer-events: none; }
@keyframes beatIn {
  from { opacity: 0; transform: translate(var(--dx, 0), var(--dy, 26px)) rotate(calc(var(--r, 0deg) + var(--dr, 0deg))); }
  to { opacity: 1; transform: translate(0, 0) rotate(var(--r, 0deg)); }
}
@keyframes leave { to { opacity: 0; transform: translateY(18px); } }
@media (prefers-reduced-motion: reduce) {
  .screen.enter [data-beat], .screen.leave { animation-duration: .01s !important; animation-delay: 0s !important; }
}

/* ---------- 按鈕 ---------- */
.btn {
  display: flex; align-items: center; justify-content: center;
  width: 100%; min-height: 64px; border-radius: 999px;
  font-size: 24px; font-weight: 900; letter-spacing: .02em;
  transition: transform .08s, box-shadow .08s;
}
.btn-primary { background: var(--teal); color: var(--cream); border: 2px solid var(--navy); box-shadow: 0 5px 0 var(--navy); }
.btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--navy); }
.btn-secondary { min-height: 56px; font-size: 22px; color: var(--navy); border: 2px solid var(--navy); }
.btn-secondary:active { background: rgba(31, 42, 68, .06); }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* ---------- 首頁 ---------- */
.chip { align-self: flex-start; background: var(--mustard); color: var(--navy); font-weight: 900; font-size: 22px; line-height: 1.1; letter-spacing: .08em; padding: 9px 20px 8px; border-radius: 999px; border: 2px solid var(--navy); box-shadow: 0 4px 0 var(--navy); margin-top: 4px; }
.chip .x { color: var(--orange); margin: 0 .12em; }
.cover-art { position: relative; flex: 1; min-height: 0; margin-block: 10px 22px; }
.cover-title { position: absolute; left: -6px; top: 0; width: 60%; max-height: 46%; object-fit: contain; object-position: left top; z-index: 2; }
.photo { background: var(--cream); border-radius: 26px; padding: 9px; box-shadow: var(--shadow-photo); }
.photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 19px; }
.cover-card { position: absolute; right: 0; bottom: 0; height: 60%; aspect-ratio: 3 / 4; max-width: 74%; }
.sticker {
  position: absolute; left: -48px; top: 5%; width: 100px; height: 100px; border-radius: 50%;
  background: var(--mustard); color: var(--navy); display: grid; place-items: center; text-align: center;
  font-weight: 900; font-size: 20px; line-height: 1.15; transform: rotate(-16deg); box-shadow: 0 3px 0 rgba(31, 42, 68, .25);
}

/* ---------- 說明 ---------- */
.howto-title { width: 74%; margin-top: 18px; }
.steps { display: flex; flex-direction: column; gap: 18px; margin-top: 20px; flex: 1; }
.step { display: flex; align-items: center; gap: 14px; background: var(--cream); border-radius: 22px; padding: 18px 18px; font-size: 19px; font-weight: 700; box-shadow: var(--shadow-photo); }
.step b { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--mustard); display: grid; place-items: center; font-weight: 900; font-size: 20px; }
.step:nth-child(2) { margin-left: 10px; }
.step:nth-child(3) { margin-left: 20px; }

/* ---------- 題目 ---------- */
.topbar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.back { flex: none; width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center; font-size: 30px; font-weight: 900; border-radius: 50%; }
.back:disabled { opacity: .25; cursor: default; }
.track { flex: 1; height: 10px; border-radius: 5px; background: var(--blush); overflow: hidden; }
.fill { height: 100%; border-radius: 5px; background: var(--mustard); width: 0; transition: width .45s var(--ease-out); }
.count { flex: none; font-weight: 700; font-size: 15px; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.home { flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--cream); border: 1.5px solid var(--navy); font-weight: 700; font-size: 15px; }
.q-num { display: flex; height: clamp(76px, 13cqh, 124px); margin-top: 4px; }

.scene .photo { position: absolute; inset: 0; border-radius: 22px; padding: 6px; }

.tape { position: absolute; top: -12px; width: 84px; height: 26px; background: var(--mustard); opacity: .9; transform: translateX(-50%) rotate(var(--tr, 5deg)); z-index: 2; }
.q-text { font-weight: 900; font-size: clamp(24px, 3.7cqh, 32px); line-height: 1.25; margin-top: 18px; text-wrap: balance; }
.spacer { flex: 1; min-height: 12px; }
.option {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; text-align: left;
  background: var(--cream); border: 2px solid var(--navy); border-radius: 20px; padding: 12px 18px 12px 12px;
  font-size: 20px; font-weight: 700; line-height: 1.35; transition: background .15s, color .15s, transform .08s;
}
.option .letter { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--mustard); display: grid; place-items: center; font-weight: 900; }
.option:active { transform: scale(.98); }
.option.picked { background: var(--orange); color: var(--cream); }
.option.picked .letter { background: var(--cream); color: var(--navy); }

/* ---------- 四級作答 ---------- */
.pick { display: flex; flex-direction: column; gap: 14px; }
.stmts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stmt { margin: 0; background: var(--cream); border: 2px solid var(--navy); border-radius: 18px; padding: 10px 12px 12px; font-weight: 700; font-size: 17px; line-height: 1.4; text-wrap: pretty; }
.stmt .side { display: block; width: fit-content; margin-bottom: 6px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 900; color: var(--cream); background: var(--teal); }
.stmt.r .side { background: var(--orange); }
.scale { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); }
.scale::before { content: ""; position: absolute; left: 12.5%; right: 12.5%; top: 27px; height: 3px; border-radius: 2px; background: rgba(31, 42, 68, .22); }
.scale button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; line-height: 1.2; color: var(--slate); }
.scale .dw { height: 56px; display: grid; place-items: center; }
.scale .dot { --c: var(--teal); width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--c); background: var(--cream); color: var(--cream); display: grid; place-items: center; transition: transform .08s, background .15s; }
.scale .r .dot { --c: var(--orange); }
.scale .big .dot { width: 56px; height: 56px; }
.scale .dot svg { width: 60%; height: 60%; opacity: 0; }
.scale button:active .dot { transform: scale(.92); }
.scale button.picked .dot { background: var(--c); }
.scale button.picked .dot svg { opacity: 1; }
.scale button.picked .lbl { color: var(--navy); }
@media (hover: hover) { .scale button:hover .dot { background: color-mix(in srgb, var(--c) 22%, var(--cream)); } .scale button.picked:hover .dot { background: var(--c); } }
.scene .photo img.flip { transform: scaleX(-1); }
.question .scene { width: min(100%, 26cqh * 1.5); }
.question .q-num { height: clamp(64px, 11cqh, 124px); }
.question .q-text { margin-top: 14px; }
/* 加賽題 */
.xtra { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; margin-top: 6px; }
.xtra .label { align-self: center; margin: 0; transform: rotate(-3deg); }
.vs { display: flex; align-items: center; gap: 4px; height: clamp(96px, 17cqh, 200px); }
.vs img { height: 100%; width: auto; }
.vs span { font-weight: 900; font-size: 26px; margin: 0 6px; }
.vs-note { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.5; max-width: 22em; text-wrap: balance; }

/* ---------- 計算中 ---------- */
.loading { justify-content: center; align-items: center; gap: 22px; text-align: center; }
.loading img { width: 86%; }
.loading p { font-size: 19px; }
.dots { display: flex; gap: 12px; }
.dots i { width: 22px; height: 22px; border-radius: 50%; background: var(--mustard); animation: bounce .9s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .12s; }
.dots i:nth-child(3) { animation-delay: .24s; }
@keyframes bounce { 50% { transform: translateY(-14px); } }

/* ---------- 結果 ---------- */
.res-letters { display: flex; height: clamp(70px, 11cqh, 104px); margin-left: -8px; }
.res-letters img { height: 100%; margin-right: -10px; }
.res-mid { display: flex; align-items: flex-start; gap: 6px; margin-top: 8px; }
.res-mid .pre { flex: 1; font-weight: 900; font-size: 26px; line-height: 1.3; padding-top: 22px; }
.res-card { flex: none; width: min(58%, 26cqh * .75); aspect-ratio: 3 / 4; }
.label { align-self: flex-start; background: var(--mustard); padding: 6px 14px; margin-top: 14px; font-weight: 900; font-size: 24px; }
.quote { font-weight: 900; font-size: 24px; line-height: 1.35; margin-top: 12px; text-wrap: balance; }
.kws { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.kws span { background: var(--blush); border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: 15px; }
.bars { display: grid; gap: 7px; margin-top: 16px; font-size: 15px; font-weight: 700; }
.bar { display: grid; grid-template-columns: 22px 1fr 22px; align-items: center; gap: 8px; text-align: center; }
.bar .b { position: relative; height: 10px; border-radius: 5px; background: var(--blush); overflow: hidden; }
.bar .b i { position: absolute; top: 0; bottom: 0; background: var(--navy); border-radius: 5px; }
.bar .on { color: var(--navy); }
.bar .off { color: var(--slate); opacity: .6; }
.mate { margin-top: 12px; font-size: 17px; color: var(--slate); }
.res-btns { margin-top: 18px; }
.friend-chip { align-self: flex-start; background: var(--cream); border: 1.5px solid var(--navy); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 14px; margin-bottom: 6px; }

/* ---------- 更認識這隻貓 ---------- */
.more-cue { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 26px; padding: 4px 8px; font-size: 19px; font-weight: 900; color: var(--navy); }
.more-cue b { font-weight: 900; background: linear-gradient(transparent 60%, var(--mustard) 60%); padding: 0 3px; }
.more-cue span { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--mustard); border: 2px solid var(--navy); box-shadow: 0 4px 0 var(--navy); animation: nudge 1.3s ease-in-out infinite; }
.more-cue svg { width: 26px; height: 26px; }
.more-cue:active span { transform: translateY(3px); box-shadow: 0 1px 0 var(--navy); animation: none; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
.more { flex: none; display: flex; flex-direction: column; margin-top: 40px; }
.more-title { margin: 0 0 16px; font-weight: 900; font-size: 30px; line-height: 1.2; }
.more-title span { display: block; font-size: 18px; color: var(--slate); }
.more-grid { display: grid; gap: 14px; }
.mcard { background: var(--cream); border: 2px solid var(--navy); border-radius: 20px; padding: 16px 18px 18px; }
.mcard.tint { background: var(--blush); }
.mcard h3 { display: inline-block; margin: 0 0 10px; padding: 0 2px; font-size: 19px; font-weight: 900; background: linear-gradient(transparent 58%, var(--mustard) 58%); }
.mcard p { margin: 0; font-size: 17px; line-height: 1.7; }
.mcard ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; font-size: 17px; line-height: 1.5; counter-reset: tip; }
.mcard li { position: relative; padding-left: 32px; counter-increment: tip; }
.mcard li::before { position: absolute; left: 0; top: 1px; width: 23px; height: 23px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 900; line-height: 1; color: var(--cream); }
.mcard .ok li::before { content: "✓"; background: var(--teal); }
.mcard .warn li::before { content: "!"; background: var(--orange); }
.mcard .tips li::before { content: counter(tip); background: var(--navy); }
.mate-card { display: flex; align-items: center; gap: 16px; }
.mate-card .photo { flex: none; width: 84px; aspect-ratio: 3 / 4; padding: 5px; border-radius: 16px; transform: rotate(-3deg); }
.mate-card .photo img { border-radius: 12px; }
.mate-card .mate-name { font-weight: 900; font-size: 18px; margin-bottom: 6px; }
.more-btns { margin-top: 22px; }

/* ---------- 面板 ---------- */
.scrim { position: absolute; inset: 0; background: var(--ink-scrim); opacity: 0; transition: opacity .2s; z-index: 20; }
.scrim.show { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 21;
  background-color: var(--cream); background-image: url("img/paper.webp"); background-size: 384px; background-blend-mode: multiply;
  border-radius: 28px 28px 0 0; padding: 12px max(24px, env(safe-area-inset-right, 0px)) calc(26px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
  transform: translateY(100%); transition: transform .32s var(--ease-out);
  display: flex; flex-direction: column; gap: 18px; max-height: 92%; overflow-y: auto;
}
.sheet.show { transform: translateY(0); }
.handle { align-self: center; width: 44px; height: 5px; border-radius: 3px; background: rgba(90, 98, 120, .35); }
.sheet h3 { margin: 0; text-align: center; font-weight: 900; font-size: 24px; }
.sheet p.note { margin: 0; text-align: center; font-size: 16px; color: var(--slate); line-height: 1.5; }
.share-row { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
@media (min-width: 420px) { .share-row { gap: 26px; } }
.share-item { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; min-width: 70px; white-space: nowrap; }
.share-item .ic { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: #FFF; font-weight: 900; font-size: 15px; letter-spacing: .04em; }
.ic.line { background: #06C755; }
.ic.fb { background: #1877F2; font-size: 26px; }
.ic.ig { background: #E1306C; }

.ic.msg { background: linear-gradient(135deg, #0099FF 0%, #A033FF 62%, #FF5280 100%); }
.ic.msg svg { width: 32px; height: 32px; }
.ic.more { background: var(--navy); font-size: 26px; line-height: 1; padding-bottom: 8px; }
.ig-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.ig-opt { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 10px; border: 2px solid var(--navy); border-radius: 20px; background: var(--blush); font-weight: 900; font-size: 19px; }
.ig-opt small { font-weight: 700; font-size: 14px; color: var(--slate); }
.thumb { background: var(--page) center / cover no-repeat; border-radius: 10px; box-shadow: var(--shadow-photo); }
.preview-img { align-self: center; max-height: 52cqh; width: auto; border-radius: 16px; box-shadow: var(--shadow-photo); -webkit-touch-callout: default; user-select: auto; }
.linkbox { display: flex; gap: 8px; }
.linkbox input { flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 10px 12px; border: 1.5px solid var(--navy); border-radius: 12px; background: #FFF; color: var(--navy); }
.toast { position: absolute; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--navy); color: var(--cream); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 15px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 30; pointer-events: none; white-space: nowrap; }

.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ---------- 配樂開關（固定在右上角） ---------- */
.music-btn {
  position: absolute; top: 14px; right: max(14px, env(safe-area-inset-right, 0px)); z-index: 15;
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--cream); color: var(--navy); border: 2px solid var(--navy); box-shadow: 0 3px 0 var(--navy);

.music-btn svg { width: 22px; height: 22px; }

.music-btn[aria-pressed="false"] .on { display: none; }
.music-btn[aria-pressed="false"] .off { display: block; }
.topbar { padding-right: 52px; }
.screen.result { padding-top: 66px; }
@container (min-width: 760px) { .screen.result { padding-top: 34px; } }

/* ---------- 電腦版：左右兩欄（畫面寬 760 以上） ---------- */
.col-a, .col-b { display: contents; }
@media (min-width: 820px) {
  .app { max-width: 1180px; }
}
@container (min-width: 760px) {
  .screen { padding-block: 34px 40px; padding-left: max(56px, env(safe-area-inset-left, 0px)); padding-right: max(56px, env(safe-area-inset-right, 0px)); }
  .screen.split { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); column-gap: 64px; }
  .screen.split > .topbar { grid-column: 1 / -1; }

    const d = D[code], cat = R[code][1], mate = R[code][4];

    return `
      <section class="more" aria-labelledby="moreTitle">

          <article class="mcard wide mate-card"><div class="photo"><img src="img/cats/${mate}.webp" alt="${R[mate][1]}" loading="lazy"></div><div><h3>最佳拍檔</h3><p class="mate-name">${mate}｜${R[mate][1]}</p><p>${d.mate}</p></div></article>
        </div>
        <div class="stack more-btns">${friend
          ? `<button class="btn btn-primary" data-act="try">我也要測</button>`
          : `<button class="btn btn-primary" data-act="share">分享我的貓</button><button class="btn btn-secondary" data-act="retry">重新測驗</button>`}</div>
      </section>`;
  }
  const DIMS = [["E", "I"], ["S", "N"], ["T", "F"], ["J", "P"]];
  const TILT = ["-6deg", "4deg", "-3deg", "5deg"];

  const stage = document.getElementById("stage");
  const sheet = document.getElementById("sheet");
  const scrim = document.getElementById("scrim");
  const toast = document.getElementById("toast");
  let quiz = null; // { seq: 題目順序（id）, flip: 左右是否對調, ans: id → +2/+1/-1/-2（正數偏向該維度第一個字母） }
  let current = null;
  let busy = false;

  // ---------- 出題與計分 ----------
  const shuffle = a => { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
  const qDim = id => (id < 20 ? Math.floor(id / 5) : QX[id - 20][0]);
  const qText = id => (id < 20 ? Q[id] : QX[id - 20].slice(1));
  // 四個維度交錯出題，同一維度不會連著出現；每題左右隨機
  function newQuiz() {
    const seq = [];
    for (let k = 0; k < 5; k++) {
      const dims = shuffle([0, 1, 2, 3]);
      if (seq.length && qDim(seq[seq.length - 1]) === dims[0]) dims.push(dims.shift());
      dims.forEach(d => seq.push(d * 5 + k));
    }
    const flip = {};
    for (let id = 0; id < 20 + QX.length; id++) flip[id] = Math.random() < 0.5;
    quiz = { seq, flip, ans: {} };
  }
  function tally(ids) {
    const sum = [0, 0, 0, 0], n = [0, 0, 0, 0];
    ids.forEach(id => { const v = quiz.ans[id]; if (v != null) { const d = qDim(id); sum[d] += v; n[d]++; } });
    return { sum, n };
  }
  function verdict() {
    const { sum, n } = tally(quiz.seq);
    const code = sum.map((s, d) => {
      if (s !== 0) return s > 0 ? DIMS[d][0] : DIMS[d][1];
      const last = [...quiz.seq].reverse().find(id => qDim(id) === d && quiz.ans[id] != null);
      return quiz.ans[last] > 0 ? DIMS[d][0] : DIMS[d][1];
    }).join("");
    const lean = sum.map((s, d) => Math.round(50 + 50 * Math.abs(s) / (2 * Math.max(n[d], 1))));
    return { code, lean };
  }
  // 答完主 20 題後，太接近的維度加賽 2 題（交錯出題）
  function next(pos) {
    if (pos === 19) {
      const main = quiz.seq.slice(0, 20);
      const { sum } = tally(main);
      const close = [0, 1, 2, 3].filter(d => Math.abs(sum[d]) <= 2);
      const extras = [];
      [0, 1].forEach(r => close.forEach(d => extras.push(20 + QX.findIndex(x => x[0] === d) + r)));
      quiz.seq = main.concat(extras);
    }
    if (pos + 1 < quiz.seq.length) question(pos + 1); else loading();
  }

  // ---------- 畫面切換 ----------
  function show(html, opts = {}) {
    const el = document.createElement("section");
    el.className = "screen enter" + (opts.scroll ? " scroll" : "") + (opts.cls ? " " + opts.cls : "");
    el.innerHTML = html;
    if (current) {
      const old = current;
      old.classList.remove("enter");
      old.classList.add("leave");
      setTimeout(() => old.remove(), 230);
    }
    stage.appendChild(el);
    current = el;
    if (opts.bind) opts.bind(el);
    const focusable = el.querySelector("[data-autofocus]");
    if (focusable) focusable.focus({ preventScroll: true });
    return el;
  }

  // ---------- 分享圖（canvas） ----------
  const imgCache = {};
  const loadImg = src => imgCache[src] || (imgCache[src] = new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }));
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();

  function wrapLines(ctx, text, maxW) {
    const lines = []; let line = "";
    for (const ch of text) { const t = line + ch; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = ch; } else line = t; }
    if (line) lines.push(line); return lines;
  }
  async function drawShare(code, kind) {
    const W = 1080, H = kind === "story" ? 1920 : 1350;
    await Promise.all(["900 60px", "700 40px"].map(f => document.fonts.load(`${f} "Noto Sans TC"`)));
    const [paper, cat, ...letters] = await Promise.all([loadImg("img/paper.webp"), loadImg(`img/cats/${code}.webp`), ...code.split("").map(L => loadImg(`img/type/${L}.webp`))]);
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const ctx = c.getContext("2d");
    const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    ctx.fillStyle = css("--page"); ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = ctx.createPattern(paper, "repeat"); ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
    const story = kind === "story";
    const top = story ? 230 : 70;
    ctx.fillStyle = css("--navy"); ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.font = `700 40px "Noto Sans TC", sans-serif`; ctx.fillText("你是哪一種貓？", W / 2, top);
    // 照片卡
    const cw = story ? 600 : 470, ch = Math.round(cw * 4 / 3), cy = top + (story ? 90 : 76);
    ctx.save(); ctx.translate(W / 2, cy + ch / 2); ctx.rotate(4 * Math.PI / 180);
    ctx.shadowColor = "rgba(31,42,68,.22)"; ctx.shadowBlur = 36; ctx.shadowOffsetY = 14;
    ctx.fillStyle = css("--cream"); rr(ctx, -cw / 2, -ch / 2, cw, ch, 44); ctx.fill();
    ctx.shadowColor = "transparent";
    const p = 18; rr(ctx, -cw / 2 + p, -ch / 2 + p, cw - 2 * p, ch - 2 * p, 30); ctx.clip();
    const iw = cw - 2 * p, ih = ch - 2 * p, s = Math.max(iw / cat.width, ih / cat.height);
    ctx.drawImage(cat, -iw / 2 + (iw - cat.width * s) / 2, -ih / 2 + (ih - cat.height * s) / 2, cat.width * s, cat.height * s);
    ctx.restore();
    // 字母
    const ls = story ? 200 : 160, step = ls * .86, lx = W / 2 - (step * 3 + ls) / 2, ly = cy + ch - (story ? 40 : 34);
    letters.forEach((im, k) => { ctx.save(); ctx.translate(lx + k * step + ls / 2, ly + ls / 2); ctx.rotate(parseFloat(TILT[k]) * Math.PI / 180); ctx.drawImage(im, -ls / 2, -ls / 2, ls, ls); ctx.restore(); });
    // 名稱貼條
    const [role, catName, line] = R[code];
    let y = ly + ls + (story ? 30 : 18);
    ctx.font = `900 ${story ? 54 : 46}px "Noto Sans TC", sans-serif`;
    const label = `${role}｜${catName}`, lw = ctx.measureText(label).width + 56, lh = story ? 84 : 72;
    ctx.save(); ctx.translate(W / 2, y + lh / 2); ctx.rotate(2 * Math.PI / 180);
    ctx.fillStyle = css("--mustard"); ctx.fillRect(-lw / 2, -lh / 2, lw, lh);
    ctx.fillStyle = css("--navy"); ctx.textBaseline = "middle"; ctx.fillText(label, 0, 2); ctx.restore();
    y += lh + (story ? 34 : 22);
    ctx.font = `900 ${story ? 48 : 40}px "Noto Sans TC", sans-serif`; ctx.textBaseline = "top"; ctx.fillStyle = css("--navy");
    wrapLines(ctx, `「${line}」`, W - 200).forEach((t, k) => ctx.fillText(t, W / 2, y + k * (story ? 66 : 54)));
    if (story) { ctx.font = `700 38px "Noto Sans TC", sans-serif`; ctx.fillText("測測你是哪一種貓 →", W / 2, H - 330); }
    return c.toDataURL("image/jpeg", .9);
  }

    setTimeout(() => { fetchRaw("audio/bgm.m4a"); fetchRaw("audio/reveal.mp3"); }, 1200);
    const decoded = {};
    const decode = url => decoded[url] || (decoded[url] = fetchRaw(url).then(b => new Promise((res, rej) => ctx.decodeAudioData(b.slice(0), res, rej))));
    function unlock() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        ctx = new AC();
        musicGain = ctx.createGain(); musicGain.gain.value = 0; musicGain.connect(ctx.destination);
        sfxGain = ctx.createGain(); sfxGain.gain.value = 1; sfxGain.connect(ctx.destination);
        decode("audio/reveal.mp3").catch(() => {});
      }
      if (ctx.state === "suspended") ctx.resume();
      return true;
    }
    function ramp(to, sec) {
      const t = ctx.currentTime;
      musicGain.gain.cancelScheduledValues(t); musicGain.gain.setValueAtTime(musicGain.gain.value, t); musicGain.gain.linearRampToValueAtTime(to, t + sec);
    }
    async function play() {
      if (!unlock()) return;
      started = true;
      try {
        const buffer = await decode("audio/bgm.m4a");
        if (!want) return;
        if (!src) { src = ctx.createBufferSource(); src.buffer = buffer; src.loop = true; src.connect(musicGain); src.start(); }
        ramp(VOL, 1.2);
      } catch (e) { started = false; }
    }
    function stop() { if (ctx && musicGain) ramp(0, 0.4); }
    // 木質「啪」：三角波快速下滑＋一小段帶通雜訊當敲擊感
    function click(pitch = 1) {
      if (!want || !unlock()) return;
      const t = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = "triangle";
      o.frequency.setValueAtTime(1180 * pitch, t); o.frequency.exponentialRampToValueAtTime(720 * pitch, t + 0.05);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + 0.1);
      const len = Math.round(ctx.sampleRate * 0.02), nb = ctx.createBuffer(1, len, ctx.sampleRate), d = nb.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const n = ctx.createBufferSource(); n.buffer = nb;
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2600 * pitch; bp.Q.value = 3;
      const ng = ctx.createGain(); ng.gain.value = 0.22;
      n.connect(bp); bp.connect(ng); ng.connect(sfxGain); n.start(t);
    }
    async function reveal() {
      if (!want || !unlock()) return;
      try {
        const buffer = await decode("audio/reveal.mp3");
        const s = ctx.createBufferSource(); s.buffer = buffer;
        const g = ctx.createGain(); g.gain.value = 0.7;
        s.connect(g); g.connect(sfxGain); s.start();
      } catch (e) {}
    }
    function render() { btn.setAttribute("aria-pressed", String(want)); btn.setAttribute("aria-label", want ? "關閉音樂與音效" : "開啟音樂與音效"); }
    btn.addEventListener("click", e => {
      e.stopPropagation();
      want = !want;
      try { localStorage.setItem("cat-mbti-music", want ? "on" : "off"); } catch (er) {}
      render();
      if (want) { play(); click(1.1); } else stop();
    });
    // 瀏覽器規定要先有互動才能出聲：每次點畫面都順便解鎖，第一次點時開始播配樂
    document.addEventListener("pointerdown", e => {
      if (btn.contains(e.target)) return;
      if (want) { unlock(); if (!started) play(); }
    }, true);
    // 所有按鈕、選項、分享項目按下時的「啪」
    document.addEventListener("click", e => {
      const el = e.target.closest("button, a.share-item");
      if (!el || el === btn) return;
      const ans = el.dataset && el.dataset.ans;
      click(ans === "B" ? 1.22 : ans === "A" ? 1.0 : 1.1);
    }, true);
    document.addEventListener("visibilitychange", () => { if (!ctx) return; if (document.hidden) ctx.suspend(); else if (want) ctx.resume(); });
    render();
    return { click, reveal };
  })();

  const start = () => { const h = (location.hash || "").slice(1).toUpperCase(); if (R[h]) result(h, null, true); else cover(); };
  start();
})();
</script>
