.screen {

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; border-radius: 12px; }

.screen.enter [data-beat="1"] { animation: beatIn .28s var(--ease-out) .06s both; }
.screen.enter [data-beat="2"] { animation: beatIn .22s var(--ease-back) .24s both; }
.screen.leave { animation: leave .22s var(--ease-out) both; pointer-events: none; }

}
@keyframes leave { to { opacity: 0; transform: translateY(18px); } }
@media (prefers-reduced-motion: reduce) {
  .screen.enter [data-beat], .screen.leave { animation-duration: .01s !important; animation-delay: 0s !important; }
}

    INFJ: ["提倡者", "占星暹羅貓", "我早就感覺到會這樣了。", ["洞察", "理想", "神秘"], "ENTP"],
    INFP: ["調停者", "詩人白貓", "讓我再發呆一下下。", ["浪漫", "溫柔", "想像力"], "ENFJ"],

    ENFP: ["競選者", "氣球橘虎斑", "好啊好啊！現在就出發！", ["熱情", "自由", "點子王"], "INTJ"],

    ESTJ: ["總經理", "吹哨棕虎斑", "集合！照規矩來！", ["務實", "組織", "直接"], "ISFP"],
    ESFJ: ["執政官", "派對布偶貓", "大家都要開心喔！", ["熱心", "社交", "顧氣氛"], "ISTP"],
    ISTP: ["鑑賞家", "機車黑貓", "壞了？給我五分鐘。", ["冷靜", "動手", "獨行"], "ESFJ"],
    ISFP: ["探險家", "畫家玳瑁貓", "我只是想畫下這個顏色。", ["敏感", "藝術", "自在"], "ESTJ"],

  };
  const DIMS = [["E", "I"], ["S", "N"], ["T", "F"], ["J", "P"]];
  const TILT = ["-6deg", "4deg", "-3deg", "5deg"];

  const stage = document.getElementById("stage");

  let answers = new Array(20).fill(null);

  // ---------- 計分 ----------
  function score(ans) {
    const counts = [0, 1, 2, 3].map(d => ans.slice(d * 5, d * 5 + 5).filter(a => a === "A").length);
    const code = counts.map((c, d) => (c >= 3 ? DIMS[d][0] : DIMS[d][1])).join("");
    return { code, counts };
  }

  // ---------- 畫面切換 ----------
  function show(html, opts = {}) {

      const old = current;

      old.classList.add("leave");

    current = el;
    if (opts.bind) opts.bind(el);

  // ---------- 首頁 ----------
  function cover() {

  // ---------- 題目 ----------
  function question(i) {
    busy = false;
    const [q, a, b] = Q[i];

  // ---------- 結果 ----------

          ? `<button class="btn btn-primary" id="tryBtn">我也要測</button>`

    setHash(code.toLowerCase());

  // ---------- 分享 ----------
  const shareUrl = code => `${SHARE_BASE}t/${code.toLowerCase()}.html`;

  function igMenu(code) {

        <button class="ig-opt" id="postBtn"><span class="thumb" style="width:88px;height:110px;background-image:url(img/cats/${code}.webp)"></span>貼文<small>4:5 直式</small></button>

  async function preview(code, kind, label) {
    openSheet(`
      <div class="handle"></div>
      <h3>正在畫你的分享圖…</h3>
    `);
    let dataUrl = "";
    try { dataUrl = await drawShare(code, kind); } catch (e) { dataUrl = ""; }
    const url = shareUrl(code);
    openSheet(`
      <div class="handle"></div>
      <h3>${label === "存分享圖" ? "你的分享圖" : `Instagram ${label}`}</h3>
      ${dataUrl ? `<img class="preview-img" src="${dataUrl}" alt="${code} 分享圖">` : `<p class="note">分享圖畫不出來，請重新試一次。</p>`}
      <p class="note">手機：長按圖片 →「加入照片」，再到 Instagram 發佈${label === "貼文" ? "貼文" : "限時動態"}。<br>電腦：在圖片上按右鍵另存。</p>
      <div class="linkbox"><input id="linkInput" value="${url}" readonly aria-label="分享連結"><button class="btn btn-primary" id="copyBtn2" style="width:auto;min-height:44px;padding:0 16px;font-size:16px;box-shadow:0 3px 0 var(--navy)">複製</button></div>

  async function copy(text, input) {
    try { await navigator.clipboard.writeText(text); flash("已複製連結"); }
    catch (e) {
      if (input) { input.focus(); input.select(); flash("已選取連結，請手動複製"); }
      else flash("無法自動複製：" + text);
    }
  }

  // ---------- 分享圖（canvas） ----------
  const imgCache = {};
  const loadImg = src => imgCache[src] || (imgCache[src] = new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }));
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function wrapLines(ctx, text, maxW) {
    const lines = []; let line = "";
    for (const ch of text) { const t = line + ch; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = ch; } else line = t; }
    if (line) lines.push(line); return lines;
  }
  async function drawShare(code, kind) {
    const W = 1080, H = kind === "story" ? 1920 : 1350;
    await Promise.all(["900 60px", "700 40px"].map(f => document.fonts.load(`${f} "Noto Sans TC"`)));
    const [paper, cat, ...letters] = await Promise.all([loadImg("img/paper.webp"), loadImg(`img/cats/${code}.webp`), ...code.split("").map(L => loadImg(`img/type/${L}.webp`))]);
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const ctx = c.getContext("2d");
    const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    ctx.fillStyle = css("--page"); ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = ctx.createPattern(paper, "repeat"); ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
    const story = kind === "story";
    const top = story ? 230 : 70;
    ctx.fillStyle = css("--navy"); ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.font = `700 40px "Noto Sans TC", sans-serif`; ctx.fillText("你是哪一種貓？", W / 2, top);
    // 照片卡
    const cw = story ? 600 : 470, ch = Math.round(cw * 4 / 3), cy = top + (story ? 90 : 76);
    ctx.save(); ctx.translate(W / 2, cy + ch / 2); ctx.rotate(4 * Math.PI / 180);
    ctx.shadowColor = "rgba(31,42,68,.22)"; ctx.shadowBlur = 36; ctx.shadowOffsetY = 14;
    ctx.fillStyle = css("--cream"); rr(ctx, -cw / 2, -ch / 2, cw, ch, 44); ctx.fill();
    ctx.shadowColor = "transparent";
    const p = 18; rr(ctx, -cw / 2 + p, -ch / 2 + p, cw - 2 * p, ch - 2 * p, 30); ctx.clip();
    const iw = cw - 2 * p, ih = ch - 2 * p, s = Math.max(iw / cat.width, ih / cat.height);
    ctx.drawImage(cat, -iw / 2 + (iw - cat.width * s) / 2, -ih / 2 + (ih - cat.height * s) / 2, cat.width * s, cat.height * s);
    ctx.restore();
    // 字母
    const ls = story ? 200 : 160, step = ls * .86, lx = W / 2 - (step * 3 + ls) / 2, ly = cy + ch - (story ? 40 : 34);
    letters.forEach((im, k) => { ctx.save(); ctx.translate(lx + k * step + ls / 2, ly + ls / 2); ctx.rotate(parseFloat(TILT[k]) * Math.PI / 180); ctx.drawImage(im, -ls / 2, -ls / 2, ls, ls); ctx.restore(); });
    // 名稱貼條
    const [role, catName, line] = R[code];
    let y = ly + ls + (story ? 30 : 18);
    ctx.font = `900 ${story ? 54 : 46}px "Noto Sans TC", sans-serif`;
    const label = `${role}｜${catName}`, lw = ctx.measureText(label).width + 56, lh = story ? 84 : 72;
    ctx.save(); ctx.translate(W / 2, y + lh / 2); ctx.rotate(2 * Math.PI / 180);
    ctx.fillStyle = css("--mustard"); ctx.fillRect(-lw / 2, -lh / 2, lw, lh);
    ctx.fillStyle = css("--navy"); ctx.textBaseline = "middle"; ctx.fillText(label, 0, 2); ctx.restore();
    y += lh + (story ? 34 : 22);
    ctx.font = `900 ${story ? 48 : 40}px "Noto Sans TC", sans-serif`; ctx.textBaseline = "top"; ctx.fillStyle = css("--navy");
    wrapLines(ctx, `「${line}」`, W - 200).forEach((t, k) => ctx.fillText(t, W / 2, y + k * (story ? 66 : 54)));
    if (story) { ctx.font = `700 38px "Noto Sans TC", sans-serif`; ctx.fillText("測測你是哪一種貓 →", W / 2, H - 330); }
    return c.toDataURL("image/jpeg", .9);
  }

  // ---------- 面板、提示 ----------
  function openSheet(html, bind) {
    scrim.hidden = false; sheet.hidden = false;
    sheet.innerHTML = html;
    requestAnimationFrame(() => { scrim.classList.add("show"); sheet.classList.add("show"); });
    if (bind) bind(sheet);
    scrim.onclick = () => closeSheet();
  }
  function closeSheet(instant) {
    scrim.classList.remove("show"); sheet.classList.remove("show");
    const done = () => { scrim.hidden = true; sheet.hidden = true; sheet.innerHTML = ""; };
    if (instant) done(); else setTimeout(done, 300);
  }
  let toastTimer;
  function flash(msg) { toast.textContent = msg; toast.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove("show"), 1800); }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });

  // ---------- 網址：#intj 這類連結直接看朋友的結果 ----------
  let settingHash = false;
  function setHash(h) {
    settingHash = true;
    try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch (e) { location.hash = h; }
    setTimeout(() => (settingHash = false), 0);
  }
  function route() {
    if (settingHash) return;
    const h = (location.hash || "").slice(1).toUpperCase();
    if (R[h]) { closeSheet(true); result(h, null, true); }
  }
  window.addEventListener("hashchange", route);

  const preloaded = new Set();
  function preload(list) { list.forEach(src => { if (preloaded.has(src)) return; preloaded.add(src); const im = new Image(); im.decoding = "async"; im.src = src; }); }
  // 預先載入第一屏與分享會用到的圖片
  preload(["img/type/title.webp", "img/cover.webp", "img/paper.webp"]);
  setTimeout(() => preload(["img/type/howto.webp", "img/scenes/01.webp", "img/scenes/02.webp", "img/type/d0.webp", "img/type/d1.webp", "img/type/d2.webp", "img/type/matching.webp"]), 600);

  const start = () => { const h = (location.hash || "").slice(1).toUpperCase(); if (R[h]) result(h, null, true); else cover(); };
  start();
})();
</script>
